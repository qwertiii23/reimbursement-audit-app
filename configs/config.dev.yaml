# 应用配置
app:
  name: "reimbursement-audit"
  version: "1.0.0"
  env: "development"  # development, staging, production
  debug: true

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  mode: "debug"  # debug, release, test
  tls: false
  cert_file: ""
  key_file: ""

# 数据库配置
database:
  host: "localhost"
  port: 3306
  username: "root"
  password: ""  # 从环境变量获取
  dbname: "reimbursement_audit"
  charset: "utf8mb4"
  collation: "utf8mb4_unicode_ci"
  parse_time: true
  loc: "Local"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

# 日志配置
logger:
  level: "debug"  # debug, info, warn, error, fatal
  format: "text"  # json, text
  output: "stdout"  # stdout, stderr, file
  filename: "logs/app.log"
  max_size: 100  # MB
  max_backups: 3
  max_age: 28  # days
  compress: true

# 文件存储配置
storage:
  type: "local"  # local, s3, oss
  local:
    base_path: "./uploads"
  s3:
    access_key: ""
    secret_key: ""
    region: ""
    bucket: ""
    endpoint: ""
  oss:
    access_key: ""
    secret_key: ""
    region: ""
    bucket: ""
    endpoint: ""

# OCR配置
ocr:
  provider: "tencent"
  secret_id: ""  # 从环境变量获取
  secret_key: ""  # 从环境变量获取
  region: "ap-beijing"
  timeout: 30
  max_retries: 3

# LLM配置
llm:
  provider: "deepseek"
  api_key: ""  # 从环境变量获取
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  max_tokens: 2000
  temperature: 0.7
  timeout: 60

# RAG配置
# RAG 配置（DeepSeek 版）
rag:
  enabled: true
  # 对话模型
  model: "deepseek-chat"
  api_key: ""  # 从环境变量获取
  api_base: "https://api.deepseek.com/v1"
  max_tokens: 1000
  temperature: 0.7
  # 向量化模型配置（使用智谱AI）
  embedding_provider: "zhipu"
  embedding_model: "embedding-2"
  embedding_api_key: ""  # 从环境变量获取
  embedding_api_base: "https://open.bigmodel.cn/api/paas/v4"
  embedding_dimension: 1024

# 认证配置
auth:
  enabled: true
  secret_key: "${JWT_SECRET_KEY}"  # 从环境变量获取
  expire_hours: 24
  issuer: "reimbursement-audit"

# 限流配置
rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 10

# CORS配置
cors:
  enabled: true
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
  expose_headers: []
  allow_credentials: true
  max_age: 86400  # seconds

# 监控配置
monitoring:
  enabled: true
  prometheus:
    enabled: true
    path: "/metrics"
  jaeger:
    enabled: false
    service_name: "reimbursement-audit"
    agent_host: "localhost"
    agent_port: 6831
  health_check:
    enabled: true
    path: "/health"
  ready_check:
    enabled: true
    path: "/ready"

postgres:
  host: "localhost"
  port: 5432
  username: "postgres"
  password: ""  # 从环境变量获取
  dbname: "reimbursement_audit"
  sslmode: "disable"